[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepsee"
version = "0.1.0"
description = "Pluggable vision layer for DeepSeek: bring multimodal ability to the DeepSeek API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["httpx>=0.27", "pillow>=10.0"]

[project.scripts]
deepsee-server = "deepsee_server.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]
server = ["fastapi>=0.110", "uvicorn>=0.29"]

[tool.hatch.build.targets.wheel]
packages = ["deepsee", "deepsee_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
